[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-lab"
version = "0.1.0"
description = "A measurable, bounded coding agent for small repository issues"
requires-python = ">=3.10"

[project.scripts]
issue-agent = "issue_agent.cli:main"

[tool.setuptools.packages.find]
include = ["issue_agent*"]
